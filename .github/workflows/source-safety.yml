name: Source publication safety
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan source and verify build-tool checksum
        run: python3 scripts/check_secrets.py
      - name: Test the publication guard
        run: python3 scripts/test_publication_guard.py
      - name: Test portable modelling helpers
        run: python3 scripts/test_modelling_skill.py
      - name: Compile Python helpers
        run: python3 -m compileall -q scripts examples skills
